# Gera uma Release a cada tag de versao (ex.: v0.1.3):
#   git tag v0.1.3 && git push origin v0.1.3
#
# Compila o executavel no Windows, confere que a tag bate com a versao do
# Cargo.toml e anexa `SaguTerm.exe` + `SaguTerm.exe.sha256` a Release. O app
# procura esses arquivos para se autoatualizar (src/update.rs).
#
# Transicao: ate a v0.1.4 o executavel se chamava `sagu-term.exe` e o
# atualizador dessas versoes procura so esse nome. Por isso a Release tambem
# leva uma copia com o nome antigo; sem ela, quem esta na v0.1.4 ou anterior
# nunca receberia atualizacoes. Pode ser removida quando ninguem mais usar
# essas versoes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Tag e versao do Cargo.toml precisam ser iguais: o app compara a tag da
      # Release com a propria versao; se divergissem, ele ofereceria a mesma
      # atualizacao para sempre.
      - name: Conferir tag x versao do Cargo.toml
        shell: pwsh
        run: |
          $versao = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$versao" -ne "${{ github.ref_name }}") {
            throw "A tag ${{ github.ref_name }} nao bate com a versao do Cargo.toml (v$versao)"
          }

      - name: Testes
        run: cargo test

      - name: Build de release
        run: cargo build --release

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/SaguTerm.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("target/release/SaguTerm.exe.sha256", "$hash  SaguTerm.exe`n")
          Get-Content target/release/SaguTerm.exe.sha256
          # Copia com o nome antigo para os atualizadores da v0.1.4 e anteriores.
          Copy-Item target/release/SaguTerm.exe target/release/sagu-term.exe
          [IO.File]::WriteAllText("target/release/sagu-term.exe.sha256", "$hash  sagu-term.exe`n")

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/SaguTerm.exe
            target/release/SaguTerm.exe.sha256
            target/release/sagu-term.exe
            target/release/sagu-term.exe.sha256
          generate_release_notes: true
